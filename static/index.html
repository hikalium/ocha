<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ocha — remote control</title>
<style>
  /* No external fonts/assets — system stack only (design §1.1). */
  :root { --bg:#101418; --panel:#192029; --line:#2a3340; --fg:#dfe6ee;
          --mut:#8a97a6; --accent:#5db0ff; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg);
         color:var(--fg); height:100vh; height:100dvh; display:flex; }
  /* Whole sidebar scrolls as one — simpler than nested scroll regions
     and survives an expanded Settings disclosure without breaking. */
  #side { width:260px; border-right:1px solid var(--line);
          background:var(--panel); overflow-y:auto; }
  #side h1 { font-size:15px; margin:0; padding:14px; border-bottom:1px solid var(--line); }
  #side h1 small { color:var(--mut); font-weight:400; }
  .srow { padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line);
          font-size:13px; }
  .srow:hover { background:#222b36; }
  .srow.sel { background:#243447; border-left:3px solid var(--accent); }
  .srow .id { font-family:ui-monospace,monospace; }
  .srow .st { color:var(--mut); font-size:12px; }
  #newbox { padding:12px; border-top:1px solid var(--line);
            display:flex; flex-direction:column; gap:6px; }
  #newbox select, #newbox input { width:100%; }
  #settings { display:flex; flex-direction:column; gap:6px; }
  #settings summary { cursor:pointer; color:var(--mut); font-size:12px;
                      padding:2px 0; user-select:none; }
  #settings summary:hover { color:var(--fg); }
  .mout { font:12.5px/1.4 ui-monospace,monospace; color:var(--mut);
          white-space:pre-wrap; max-height:140px; overflow:auto;
          padding:2px 0; min-height:0; }
  .mout.err { color:var(--bad); }
  .mout.ok  { color:var(--fg); }
  .mout ul  { margin:2px 0 0; padding-left:18px; }
  .mout .det { color:var(--mut); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { padding:10px 16px; border-bottom:1px solid var(--line);
          display:flex; align-items:center; gap:12px; }
  #pill { font-size:12px; padding:2px 9px; border-radius:10px; background:#243447;
          color:var(--accent); }
  #log { flex:1; overflow:auto; padding:16px; }
  .msg { margin:0 0 12px; }
  .msg .who { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--mut); margin-bottom:2px; }
  .msg.user .who { color:var(--accent); }
  .msg .body { white-space:pre-wrap; word-break:break-word; }
  .msg.tool { font-family:ui-monospace,monospace; font-size:12.5px; }
  .msg.tool .body { background:#0c0f13; border:1px solid var(--line);
                    border-radius:6px; padding:8px; color:var(--mut); }
  #live { white-space:pre-wrap; color:var(--fg); opacity:.9; }
  /* Per-turn verbose debug: every SSE event lands here as a muted
     monospace line; cleared by reconcile() when the turn completes. */
  .dbg { font:11px/1.4 ui-monospace,monospace; color:var(--mut);
         white-space:pre-wrap; word-break:break-all;
         margin:0 0 2px; opacity:.7; }
  #gate { margin:0 16px; padding:12px; border:1px solid var(--warn);
          border-radius:8px; background:#241f12; display:none; }
  #gate.show { display:block; }
  #gate code { color:var(--warn); word-break:break-all; }
  #gate .row { margin-top:8px; display:flex; gap:8px; }
  #composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  textarea,input { background:#0c0f13; color:var(--fg); border:1px solid var(--line);
                    border-radius:6px; padding:8px; font:inherit; }
  #prompt { flex:1; resize:none; height:42px; }
  button { background:var(--accent); color:#06121f; border:0; border-radius:6px;
           padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:#243447; color:var(--fg); }
  button.bad { background:var(--bad); color:#1a0606; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .empty { color:var(--mut); padding:40px; text-align:center; }

  /* Mobile: stack sidebar above main; 100dvh handles the mobile
     address-bar; 16px inputs suppress iOS focus-zoom; larger tap
     targets; respect the iOS home-indicator safe area. */
  @media (max-width: 700px) {
    body { flex-direction:column; }
    #side { width:auto; max-height:40vh; border-right:0;
            border-bottom:1px solid var(--line); }
    #side h1 { padding:10px 12px; font-size:14px; }
    #main { min-height:0; flex:1; }
    #bar { padding:8px 12px; flex-wrap:wrap; }
    #log { padding:12px; }
    #gate { margin:8px; }
    #composer { padding:10px 12px;
                padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
    #prompt { height:48px; }
    input, select, textarea { font-size:16px; }
    button { min-height:40px; padding:10px 14px; }
  }
</style>
</head>
<body>
  <div id="side">
    <h1>ocha <small>remote</small></h1>
    <div id="sessions"></div>
    <div id="newbox">
      <details id="settings">
        <summary>Session settings</summary>
        <select id="be" title="backend (overrides the serve default)">
          <option value="">backend: default</option>
          <option value="ollama">ollama</option>
          <option value="claude">claude</option>
          <option value="claude-cli">claude-cli</option>
        </select>
        <input id="mdl" placeholder="model (optional)">
        <input id="sys" placeholder="system (optional)">
        <input id="ohost" placeholder="ollama host (e.g. eevee)">
        <input id="oport" type="number" min="1" max="65535"
               placeholder="ollama port (default 11434)">
        <button id="listbtn" class="ghost" type="button">List available models</button>
        <div id="mout" class="mout"></div>
        <button id="sysbtn" class="ghost" type="button" disabled
                title="Send the current system prompt as a message into the active session">
          Resend system prompt to active chat
        </button>
      </details>
      <button id="newbtn">New session</button>
    </div>
  </div>
  <div id="main">
    <div id="bar">
      <span id="title" class="empty" style="padding:0">No session selected</span>
      <span id="pill" style="display:none"></span>
      <span style="flex:1"></span>
      <button id="cancel" class="ghost" style="display:none">Cancel</button>
    </div>
    <div id="gate">
      <div>Command awaiting approval:</div>
      <div><code id="gatecmd"></code></div>
      <div class="row">
        <button id="approve">Approve</button>
        <input id="denyreason" placeholder="deny reason" style="flex:1;min-width:0">
        <button id="deny" class="bad">Deny</button>
      </div>
    </div>
    <div id="log"><div class="empty">Create or pick a session.</div></div>
    <div id="composer" style="display:none">
      <textarea id="prompt" placeholder="Message…  (Enter to send)"></textarea>
      <button id="send">Send</button>
    </div>
  </div>
<script>
"use strict";
const $ = s => document.querySelector(s);
let cur = null, es = null, pendingCmd = null, live = "";

async function jget(u){ return (await fetch(u)).json(); }
async function jpost(u,b){ return fetch(u,{method:"POST",body:JSON.stringify(b||{})}); }

async function refreshSessions(){
  const list = await jget("/api/sessions");
  const box = $("#sessions"); box.innerHTML = "";
  list.sort((a,b)=>a.id<b.id?-1:1).forEach(s=>{
    const d = document.createElement("div");
    d.className = "srow" + (s.id===cur?" sel":"");
    d.innerHTML = `<div class="id">${s.id}</div>`+
      `<div class="st">${s.config.backend} · ${s.state} · ${s.messages} msg</div>`;
    d.onclick = ()=>select(s.id);
    box.appendChild(d);
  });
}

function setPill(state){
  const p = $("#pill"); p.style.display = "";
  p.textContent = state;
  p.style.color = state==="awaiting_approval" ? "var(--warn)"
                 : state==="error" ? "var(--bad)" : "var(--accent)";
  $("#cancel").style.display = (state==="awaiting_approval"||state==="generating")?"":"none";
  $("#send").disabled = state!=="idle";
  $("#sysbtn").disabled = !cur || state!=="idle";
}

function renderMessages(msgs){
  const log = $("#log"); log.innerHTML = "";
  msgs.forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg "+m.role;
    div.innerHTML = `<div class="who">${m.role}</div>`;
    const b = document.createElement("div"); b.className="body";
    b.textContent = m.content; div.appendChild(b); log.appendChild(div);
  });
  const lv = document.createElement("div"); lv.id="live"; log.appendChild(lv);
  log.scrollTop = log.scrollHeight;
}

function showGate(p){
  pendingCmd = p ? p.cmd_id : null;
  const g = $("#gate");
  if(!p){ g.classList.remove("show"); return; }
  const r = p.request;
  $("#gatecmd").textContent = `${r.binary} ${(r.args||[]).join(" ")}  —  ${r.description||""}`;
  g.classList.add("show");
}

async function reconcile(){
  if(!cur) return;
  const s = await jget("/api/sessions/"+cur);
  setPill(s.state);
  renderMessages(s.messages);
  showGate(s.pending_command);
  refreshSessions();
}

// Verbose debug: every SSE event lands in #log as a muted line so the
// transcript shows the full protocol flow (cleared per turn by
// reconcile()). Insert above #live so streamed tokens stay last.
function logDbg(ev, data){
  const log = $("#log"); if (!log) return;
  const ts = new Date().toISOString().slice(11, 23);
  const d = document.createElement("div"); d.className = "dbg";
  d.textContent = `[${ts}] ${ev}: ${data || ""}`;
  const live = $("#live");
  if (live) live.parentNode.insertBefore(d, live); else log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

// Append one message bubble directly (used for immediate local echo of
// what the user just sent; reconcile() will re-render canonically when
// the turn completes).
function appendMsg(role, content){
  const log = $("#log");
  const div = document.createElement("div"); div.className = "msg "+role;
  div.innerHTML = `<div class="who">${role}</div>`;
  const b = document.createElement("div"); b.className = "body";
  b.textContent = content;
  div.appendChild(b);
  const live = $("#live");
  if (live) live.parentNode.insertBefore(div, live); else log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function openStream(id){
  if(es) es.close();
  es = new EventSource(`/api/sessions/${id}/events`);
  // Wrap so every event is logged for debug before its specific handler.
  const on = (type, fn) => es.addEventListener(type, e => { logDbg(type, e.data); fn(e); });
  const liveEl = () => $("#live");
  on("snapshot", e => { const s = JSON.parse(e.data);
    setPill(s.state); renderMessages(s.messages); showGate(s.pending_command); });
  on("state", e => setPill(JSON.parse(e.data).state));
  on("token", e => { live += JSON.parse(e.data).text;
    if (liveEl()) liveEl().textContent = live; $("#log").scrollTop = 1e9; });
  on("command_pending", e => showGate(JSON.parse(e.data)));
  on("turn_complete", () => { live = ""; reconcile(); });
  on("error", e => { try { alert("error: " + JSON.parse(e.data).message); } catch(_){} });
  // Capture-for-debug-only events (rendering is owned by reconcile +
  // showGate above; we just want them in the verbose log).
  on("ping",              () => {});
  on("reminder",          () => {});
  on("message",           () => {});
  on("command_executing", () => {});
  on("command_result",    () => {});
}

async function select(id){
  cur = id; live = "";
  $("#title").textContent = id; $("#title").className = "";
  $("#composer").style.display = "flex";
  openStream(id);
  await reconcile();
}

// Default system prompt: a concise explanation of ocha's plain-text
// command protocol, seeded into localStorage only the first time the
// UI is opened (never overwriting a user-cleared or user-set value).
const SYSTEM_DEFAULT =
  "You can run shell commands through ocha's plain-text protocol. " +
  "To execute one, emit ONE line that begins exactly with `!!!OCHA_RUN_CMD` " +
  "immediately followed by a compact JSON object with the keys:\n" +
  "  \"binary\"      string — the executable\n" +
  "  \"args\"        array of strings — arguments\n" +
  "  \"timeout\"     integer seconds\n" +
  "  \"description\" string — short human-readable purpose\n" +
  "Example:\n" +
  "  !!!OCHA_RUN_CMD{\"binary\":\"ls\",\"args\":[\"-la\"],\"timeout\":5,\"description\":\"List files\"}\n" +
  "Put that line on its own; ocha runs the command and replies with " +
  "{\"status\",\"stdout\",\"stderr\",...} as the next message — continue " +
  "based on that result. Run one command at a time and verify each " +
  "result before proceeding.";
if (localStorage.getItem("ocha.system") === null) {
  localStorage.setItem("ocha.system", SYSTEM_DEFAULT);
}

// All session-settings inputs persist across reloads so the "last
// choice" sticks. Each form field maps to one localStorage key.
const STG = [
  ["#be",    "ocha.backend", "change"],
  ["#mdl",   "ocha.model",   "input" ],
  ["#sys",   "ocha.system",  "input" ],
  ["#ohost", "ocha.ollama.host", "input"],
  ["#oport", "ocha.ollama.port", "input"],
];
for (const [sel, key, ev] of STG) {
  const el = $(sel);
  el.value = localStorage.getItem(key) || "";
  el.addEventListener(ev, e=> localStorage.setItem(key, e.target.value));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// List models honoring the current Settings (backend + ollama host/port).
// 3s AbortController timeout so the button always resolves to a result,
// "Timed out after 3s", or "Error: …".
$("#listbtn").addEventListener("click", async ()=>{
  const out = $("#mout"), btn = $("#listbtn");
  out.className = "mout"; out.textContent = "Listing models…";
  const p = new URLSearchParams();
  const be = $("#be").value;                  if (be) p.set("backend", be);
  const oh = $("#ohost").value.trim();        if (oh) p.set("server", oh);
  const op = parseInt($("#oport").value, 10); if (Number.isFinite(op)) p.set("port", op);
  const url = "/api/models" + (p.toString() ? "?" + p : "");
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 3000);
  btn.disabled = true;
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { msg = (await r.json()).error || msg; } catch(_) {}
      out.className = "mout err"; out.textContent = "Error: " + msg;
      return;
    }
    const j = await r.json();
    const ms = j.models || [];
    if (!ms.length) { out.textContent = "No models reported."; return; }
    out.className = "mout ok";
    out.innerHTML = "<ul>" + ms.map(m =>
      "<li>" + escapeHtml(m.name)
      + (m.detail ? ` <span class="det">${escapeHtml(m.detail)}</span>` : "")
      + "</li>").join("") + "</ul>";
  } catch (e) {
    out.className = "mout err";
    out.textContent = (e.name === "AbortError")
      ? "Timed out after 3s"
      : ("Error: " + (e.message || e));
  } finally {
    clearTimeout(timer); btn.disabled = false;
  }
});

// Send the current Settings system prompt as a user message into the
// active session, to "refresh" the LLM's context with it. Pure client
// side — uses the existing POST /messages, no server change. The
// button is enabled only when a session is selected and idle (see
// setPill); 409 from the server is surfaced as an alert just in case.
$("#sysbtn").addEventListener("click", async ()=>{
  if (!cur) { alert("No active session"); return; }
  const sys = $("#sys").value.trim();
  if (!sys) { alert("System prompt is empty"); return; }
  appendMsg("user", sys);                            // immediate echo
  const r = await jpost(`/api/sessions/${cur}/messages`, { content: sys });
  if (r.status === 409) { alert("Session is busy — try again when idle"); }
});

$("#newbtn").onclick = async ()=>{
  const body = {};
  const be = $("#be").value;            if (be)  body.backend = be;
  const mdl = $("#mdl").value.trim();   if (mdl) body.model   = mdl;
  const sys = $("#sys").value.trim();   if (sys) body.system  = sys;
  // Ollama transport override; sent only when the user actually set
  // it. The API ignores it for non-ollama backends.
  const oh = $("#ohost").value.trim();        if (oh) body.server = oh;
  const op = parseInt($("#oport").value, 10); if (Number.isFinite(op)) body.port = op;
  const r = await jpost("/api/sessions", body);
  const j = await r.json();
  // Settings are intentionally NOT cleared — they're the "last choice"
  // that pre-fills the next session.
  await refreshSessions(); select(j.id);
};
$("#send").onclick = async ()=>{
  const t = $("#prompt").value.trim(); if(!t||!cur) return;
  $("#prompt").value=""; live="";
  appendMsg("user", t);                              // immediate echo
  await jpost(`/api/sessions/${cur}/messages`, {content:t});
};
$("#prompt").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#send").click(); }
});
$("#approve").onclick = async ()=>{
  if(!cur||!pendingCmd) return;
  await jpost(`/api/sessions/${cur}/commands/${pendingCmd}/approve`);
  showGate(null);
};
$("#deny").onclick = async ()=>{
  if(!cur||!pendingCmd) return;
  await jpost(`/api/sessions/${cur}/commands/${pendingCmd}/deny`,
              {reason:$("#denyreason").value||"denied by operator"});
  $("#denyreason").value=""; showGate(null);
};
$("#cancel").onclick = async ()=>{ if(cur) await jpost(`/api/sessions/${cur}/cancel`); };

refreshSessions();
</script>
</body>
</html>
