[package]
name = "ocha"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
futures-util = "0.3.31"
reqwest = { version = "0.13.2", features = ["blocking", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full", "io-util"] }

[dev-dependencies]
assert_cmd = "2.1.2"
tempfile = "3.24.0"
